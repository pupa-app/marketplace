name: release

# Auto-tag + GitHub Release when CHANGELOG's top version is new.
# Reads the first `## [X.Y.Z] — DATE` heading; if tag vX.Y.Z is absent,
# validates, then creates the tag and release. Idempotent: existing tag = no-op.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read top version from CHANGELOG
        id: ver
        run: |
          v=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '## []')
          if [ -z "$v" ]; then echo "no released version heading found"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Top version: $v"

      - name: Skip if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.ver.outputs.version }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate catalog
        if: steps.check.outputs.exists == 'false'
        run: make validate

      - name: Extract release notes
        if: steps.check.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk "/^## \\[$v\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md > notes.md
          cat notes.md

      - name: Create tag + release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          git tag -a "v$v" -m "$v"
          git push origin "v$v"
          gh release create "v$v" --title "v$v" --notes-file notes.md
